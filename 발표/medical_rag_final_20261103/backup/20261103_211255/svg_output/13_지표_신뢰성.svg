    <text x="84" y="604" font-size="18" fill="#1F2328"><tspan font-weight="bold" fill="#12355B">그 밖의 장치 </tspan>검증으로 고르고 시험은 보고만<tspan x="84" dy="26" fill="#52514E">부트스트랩 95% CI · 같은 질문·후보·심판 캐시</tspan></text>
  </g>
  <g id="limits" data-pptx-bounds="652 576 564 72">
    <rect x="652" y="576" width="564" height="68" rx="12" fill="#FFFFFF" stroke="#EB6834" stroke-width="1"/>
    <text x="672" y="604" font-size="18" fill="#1F2328"><tspan font-weight="bold" fill="#EB6834">한계 </tspan>1점 vs 2점은 맞음/틀림 수준으로만 신뢰<tspan x="672" dy="26" fill="#52514E">사람 표본 40개 · DPO 선택은 시험 결과(.678)를 보고 바꿈</tspan></text>
