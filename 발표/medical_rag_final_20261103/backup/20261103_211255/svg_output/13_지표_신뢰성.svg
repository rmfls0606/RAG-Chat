  <g id="header" data-pptx-bounds="64 80 1152 96">
    <text x="64" y="120" font-size="42" font-weight="bold" fill="#12355B">심판은 깐깐하게만 틀린다 — 정답률은 부풀려지지 않는다</text>
    <text x="64" y="162" font-size="24" fill="#52514E">사람 판정 40개와 비교하고, 다른 계열 심판(Phi-4)으로 다시 채점했다</text>
  </g>
  <g id="human-check" data-pptx-bounds="64 196 368 376">
    <image href="../images/09_judge_vs_human.png" x="64" y="196" width="360" height="288" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="508" font-size="18" fill="#1F2328">심판이 정답이라 한 12개는 사람도 정답<tspan x="64" dy="24" fill="#52514E">틀릴 때는 늘 깐깐한 쪽</tspan><tspan x="64" dy="24" fill="#52514E">(사람 정답 24개 중 12개를 부분으로)</tspan></text>
  </g>
  <g id="cross-judge" data-pptx-bounds="448 196 532 376">
    <image href="../images/07_cross_judge.png" x="456" y="196" width="524" height="288" preserveAspectRatio="xMidYMid meet"/>
    <text x="456" y="508" font-size="18" fill="#1F2328">Phi-4로 다시 채점해도 검증 정답률 순위 동일<tspan x="456" dy="26" fill="#52514E">결론이 특정 심판에 기대지 않음</tspan></text>
  </g>
  <g id="agreement-kpi" data-pptx-bounds="1004 196 212 376">
    <rect x="1004" y="196" width="212" height="288" rx="12" fill="#EEF4FC"/>
    <text x="1028" y="236" font-size="18" fill="#52514E">사람 vs 심판 일치</text>
    <text x="1028" y="318" font-size="72" font-weight="bold" fill="#2A78D6">.88</text>
    <text x="1028" y="360" font-size="18" fill="#1F2328">오답 vs 부분 이상<tspan x="1028" dy="26">40개 중 35개 일치</tspan></text>
    <text x="1028" y="444" font-size="15" fill="#52514E">세부 3단계 일치는 .57</text>
