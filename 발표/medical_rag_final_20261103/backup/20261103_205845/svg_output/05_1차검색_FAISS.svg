    <text x="88" y="592" font-size="18" fill="#1F2328"><tspan font-weight="bold" fill="#12355B">왜 Vector DB 대신 파일? </tspan>DB가 고정이라 수정 불필요,<tspan x="88" dy="26">Colab에서 서버 없이 Drive 파일 하나로 동작</tspan></text>
